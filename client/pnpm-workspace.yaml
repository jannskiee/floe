allowBuilds:
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm 11 reads dependency overrides from this workspace file; the package.json
# "pnpm.overrides" field is ignored once this file exists. Security pins live here.
overrides:
  esbuild: ^0.28.1
  ws: ^8.21.0
  postcss: ^8.5.23
  # GHSA-2v37-7h3g-55p8 (CVE-2026-67213): a custom generator loops forever when
  # size is zero. nanoid is here only as postcss ID source, and postcss 8.5.25
  # and 8.5.26 declare ^3.3.16 and ^3.3.17, both of which 3.3.18 already
  # satisfies, so only the frozen lockfile was holding it back. Keep this on the
  # 3.x line: 3.3.18 is the last 3.x release, and 4.x and later are ESM-only,
  # which postcss 8 will not accept. Build-time only, never in the bundle.
  nanoid: ^3.3.18
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  minimatch@3: ^3.1.3
  minimatch@9: ^9.0.7
  socket.io-parser: ^4.2.7
  flatted: ^3.4.2
  # GHSA advisories 2026-07 and GHSA-rgw5-rvv9-x895: DoS via pathological inputs
  # in dev tooling. brace-expansion needs a pin per major line, because the two
  # lines reach us through different minimatch majors.
  #
  # The 1.x line used to be stuck. The previous note here said it "cannot be
  # moved" because minimatch@3 (via eslint's config-array and eslintrc)
  # CommonJS-requires brace-expansion's default export, 5.x changed that shape,
  # and forcing 5.0.8 there failed with "expand is not a function". That is
  # still true of 5.x on minimatch@3, but the conclusion is now stale: 1.1.18
  # exists and is the same CommonJS shape as 1.1.17, same dependency set, so the
  # 1.x line moves to its own patched release rather than across majors.
  # Both lines are dev tooling that never ships.
  brace-expansion@1: ^1.1.18
  brace-expansion@5: ^5.0.9
  js-yaml: ^4.3.1
