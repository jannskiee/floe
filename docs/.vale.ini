StylesPath = styles
MinAlertLevel = error

; Lint .mdx with the Markdown parser. This section is the whole reason the
; check works: a format association is only valid in a top-level [formats]
; block. Written as a bare "mdx = md" inside the glob section below, Vale
; parses it as a rule toggle instead, leaves .mdx on its native MDX parser,
; and that parser hard-errors on the angle-bracket placeholders this repo
; uses in prose (<url>, <version>, <uuid>, <short>) and on changelog.mdx.
; A single E100 aborts the entire run, so for months this check reported
; "There was an error running Vale" and linted nothing at all.
[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Floe

; changelog.mdx keeps the British spellings in its shipped entries, because they
; describe releases whose UI really did say "Cancelling". Re-spelling them would
; misdescribe what those versions did.
;
; This section must contain ONLY the rule toggle. Adding BasedOnStyles here would
; silently switch EmDash off for the changelog: Vale registers a section in
; StyleKeys only when it declares BasedOnStyles, and the resulting BaseStyles is
; assigned rather than merged. The leading * matters too, because section globs
; match the path as Vale was invoked with it and * crosses separators.
[*changelog.mdx]
Floe.Spelling = NO
