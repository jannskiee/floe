name: Release

# Publishes cross-platform CLI binaries to GitHub Releases when a version tag
# (e.g. v1.0.0) is pushed. Build/archive/checksum config lives in .goreleaser.yml.
# Package manager manifests (Homebrew Cask, Scoop, Winget) are published by the
# same run, once the owner has approved it (the release environment below),
# using TAP_GITHUB_TOKEN (a PAT with write access to the shared
# jannskiee/homebrew-tap, jannskiee/scoop-bucket, and the jannskiee/winget-pkgs
# fork). These repos are reused across all projects.
on:
  push:
    tags:
      - 'v*'

# No workflow-level grants: the goreleaser job declares the contents: write
# it needs, and any job added later starts from zero permissions.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a publish, as in images.yml and desktop-release.yml: a second
  # run on the same tag queues behind the first instead of racing it to the
  # GitHub release and the shared package-manager repositories.
  cancel-in-progress: false

jobs:
  goreleaser:
    name: GoReleaser
    # Pinned, as images.yml is: a v* tag is permanent and its run cannot pick
    # up a changed workflow, so a release does not ride a runner-image move.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # TAP_GITHUB_TOKEN is a secret of this environment, not of the repository.
    # The environment opens only for v* tags and only after the owner approves
    # the run (one Approve per release; admins cannot bypass it), so neither a
    # workflow on another ref nor a tag nobody expected can read the token.
    # A waiting run holds this tag's concurrency group, and a rerun asks again.
    environment: release
    permissions:
      # Create the GitHub Release and upload its assets.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags needed for changelog and versioning
          # GoReleaser talks to GitHub through GITHUB_TOKEN env, never
          # git-over-HTTP, so the checkout credential must not outlive this step.
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # The minor is the toolchain the binaries are built with, and it is
          # ahead of the go line of go.mod and go.work, the floor a source
          # build is held to (1.27 here, 1.26.0 there, since 2026-10-16; the
          # comment in go.work says why). Go 1.27 needs macOS 13 Ventura or
          # later, so the darwin archives do too.
          #
          # A release builds on the newest 1.27 patch in the actions/go-versions
          # manifest, not on whichever one the runner image has cached. Without
          # this, setup-go takes the cached patch that satisfies the spec, and
          # the image trails upstream: on 2026-10-10 it still held 1.26.8, two
          # days after 1.26.9 was tagged. If the manifest cannot be read,
          # setup-go quietly falls back to the cached patch, so the step never
          # fails for it. ci.yml sets the same flag on every Go job, so the
          # patch a release picks is normally one CI has already built and
          # tested. The exception is a tag pushed after a new patch reaches the
          # manifest and before any CI run.
          check-latest: true
          # No module cache in the release build: this workflow publishes
          # binaries from a tag push, and a cache entry poisoned by any other
          # workflow would flow straight into the shipped artifacts. Building
          # from source costs a few minutes once per release.
          cache: false

      # The previous v* tag, which starts the range the release notes cover.
      # Left to itself, GoReleaser starts at the nearest earlier tag of either
      # series, so a v* tag cut after a separately pushed desktop-v* tag listed
      # only the commits since that desktop tag: v1.11.5's notes started at
      # desktop-v1.0.2 and covered 5 of the 25 commits since v1.11.4, leaving
      # out the pull requests of six outside contributors. --match keeps the
      # desktop-v* tags out of the search, and the ^ starts it at the parent
      # commit, so the tag being released never finds itself. Nor does a v* tag
      # on the same commit: a next number cut on an unchanged commit counts from
      # the v* tag before that one, as GoReleaser's own fallback would. Under
      # bash -e a tag with no v* tag behind it stops the release here, rather
      # than letting GoReleaser fall back to the old range.
      - name: Find the previous v* tag
        id: range
        shell: bash
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^")"
          echo "Release notes cover ${previous}..${GITHUB_REF_NAME}"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # Exact version, not a '~> v2' range, for two reasons. A range downloads
          # whatever 2.x exists when a tag is pushed, and that binary runs in the
          # step carrying TAP_GITHUB_TOKEN, so a concrete version is the only thing
          # keeping an unreviewed release out of here. A range also resolves the tag
          # through goreleaser.com/releases.json, a non-GitHub host whose answer is
          # concatenated straight into the download URL; an exact semver skips that
          # lookup entirely. The action checksums the download either way, but
          # checksums.txt ships from the release it verifies, so it catches a
          # corrupted download rather than a bad release.
          # v2.17.1 built v1.10.0, so this changes nothing about today's output.
          # Dependabot keeps `uses:` refs current but not action inputs, so bump
          # this line by hand when a release needs a newer GoReleaser.
          version: 'v2.17.1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic personal access token with only the public_repo scope, which
          # covers the shared homebrew-tap, scoop-bucket, and the PR from the
          # winget-pkgs fork. Create it at Settings > Developer settings > Personal
          # access tokens (with an expiry), and store it as the TAP_GITHUB_TOKEN
          # secret of this repository's `release` environment, never as a
          # repository secret. Only floe publishes into these shared repos today;
          # a project that joins later needs its own copy of the token, and then
          # regenerating the token means replacing every copy.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # The range the release notes cover, from the step above. The tag being
          # released is named too: without it GoReleaser takes the first tag on
          # the commit in version order, and a paired release puts desktop-vX.Y.Z
          # on the same commit (v1.11.6 came first only because v sorts after d).
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.range.outputs.previous }}
