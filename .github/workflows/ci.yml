name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual full-suite run. Recovery for dropped push events (GitHub's event
  # pipeline lost two main pushes on 2026-07-19; lost runs never fire
  # retroactively) and a cheap way to re-roll the suite when investigating
  # flaky tests. The changes job treats every non-pull_request event as a
  # full-suite run, so no path skips apply here.
  workflow_dispatch:

# Least-privilege default for the GITHUB_TOKEN in every job. The only token
# use is back-compat's gh release view/download against this repo's public
# releases, which contents: read covers.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs; never cancel runs on main
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # 'true' unless every changed file is under docs/. Negation-based on
      # purpose: anything not under docs/ counts as code, so a new top-level
      # file or directory can never silently skip CI.
      code: ${{ steps.filter.outputs.code }}
      # 'true' when any changed file is under .github/workflows/. Gates the
      # actionlint job; push events always report true, same as code.
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull_request checkout is the PR merged into its base; depth 2
          # brings in both parents so HEAD^1 (the base tip) is diffable.
          fetch-depth: 2
          persist-credentials: false

      - name: Classify changed files
        id: filter
        run: |
          # Push events (main) always run the full suite: main only advances
          # by PR merge, and a multi-commit (rebase) merge would make a HEAD^1
          # diff under-classify the push.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "push event: full suite"
            exit 0
          fi
          # First-parent diff of the merge commit = the PR's effective changes
          # against the base tip. A bare assignment on purpose: under the
          # default bash -e shell a failing git diff fails this job, every
          # heavy job then skips, and the CI green gate goes red (fail
          # closed). --no-renames lists a rename as delete plus add, so a
          # file moved between docs/ and code paths always surfaces its code
          # side.
          changed="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          non_docs="$(printf '%s\n' "$changed" | grep -v '^docs/' || true)"
          if [ -n "$non_docs" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "non-docs changes:"
            echo "$non_docs"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change: heavy jobs will be skipped"
          fi
          # Same diff, second classification: workflow edits gate actionlint.
          # scripts/ counts too. images.yml calls .github/scripts/smoke-image.sh,
          # and a change to only that script would otherwise skip the lint job
          # entirely, leaving the shell CI actually runs completely unchecked.
          workflow_files="$(printf '%s\n' "$changed" | grep -E '^\.github/(workflows|scripts)/' || true)"
          if [ -n "$workflow_files" ]; then
            echo "workflows=true" >> "$GITHUB_OUTPUT"
            echo "workflow changes:"
            echo "$workflow_files"
          else
            echo "workflows=false" >> "$GITHUB_OUTPUT"
          fi

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes]
    # Runs only when workflow files changed; the gate counts the skip as a
    # pass, same as the docs fast path.
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          # Pinned release verified against a hardcoded digest, extending the
          # commit-SHA pin philosophy to this download (the checksums file
          # shipped with a release would match a compromised release). Bump
          # version and hash together, deliberately.
          ACTIONLINT_VERSION: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          gh release download "$ACTIONLINT_VERSION" --repo rhysd/actionlint \
            --pattern 'actionlint_*_linux_amd64.tar.gz'
          echo "$ACTIONLINT_SHA256  actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" | sha256sum --check
          tar -xzf actionlint_*_linux_amd64.tar.gz actionlint
          chmod +x actionlint

      - name: Lint workflows
        # Zero ignore flags on purpose: the tree lints clean after the
        # quoting fixes and must stay clean.
        run: ./actionlint -color

      - name: Lint shell scripts
        # actionlint shellchecks the shell embedded in workflow YAML, but not the
        # scripts that YAML calls out to. images.yml runs
        # .github/scripts/smoke-image.sh, so check it directly. shellcheck is
        # preinstalled on ubuntu-latest.
        run: shellcheck .github/scripts/*.sh

  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # changes must be listed in needs above, or this expression reads an
    # empty context, evaluates false, and the job silently never runs again.
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Version comes from packageManager in client/package.json
          package_json_file: client/package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Lint
        run: pnpm lint
        working-directory: client

      - name: Unit tests
        run: pnpm test
        working-directory: client

      - name: Build
        run: pnpm build
        working-directory: client
        env:
          # Use the live signaling server — matches the default in client/.env.example
          NEXT_PUBLIC_SOCKET_URL: https://api.floe.one

      # Reads the prerendered HTML the Build step just produced. It has to be
      # the built output: the tab title is assembled at render time from
      # title.template in app/layout.tsx plus a bare title on each page, so no
      # test that imports a module can see the string a visitor actually gets.
      # A step rather than a job on purpose — this rides an already-gated job, so
      # CI green's needs list is untouched.
      - name: Check page titles
        run: node scripts/check-titles.mjs
        working-directory: client

      # /download derives every desktop asset URL from DESKTOP_VERSION, so a
      # bump that lands before the desktop-v* release exists points the page at
      # 404s (the 0.2.3 bump landed 15 minutes after its assets; that margin is
      # the whole reason for the order). Ask GitHub, not git: the checkout
      # above is depth 1 without tags. A step rather than a job for the same
      # reason as the title check.
      - name: Check desktop release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(grep -o "DESKTOP_VERSION = '[^']*'" client/lib/desktopRelease.ts | grep -o '[0-9.]\+')"
          names="$(gh release view "desktop-v$v" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for a in "floe-desktop-setup-$v.exe" "floe-desktop-$v-windows-amd64.zip" SHA256SUMS.txt; do
            printf '%s\n' "$names" | grep -qxF "$a" || { echo "desktop-v$v is missing asset $a" >&2; exit 1; }
          done
          echo "desktop-v$v has all assets"

  server:
    name: Server (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Test
        run: npm test
        working-directory: server

  cli:
    name: CLI (Go, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # One OS failing must not hide results from the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Vet
        run: go vet ./...
        working-directory: cli

      - name: Test
        # -count=1 bypasses Go's test-result cache so stability re-runs always execute
        run: go test -count=1 ./...
        working-directory: cli

      - name: Build
        run: go build ./cmd/floe
        working-directory: cli

  desktop:
    name: Desktop (Wails, windows-latest)
    # Windows-only on purpose: the desktop app ships Windows-only for the beta,
    # and the Go code is thick with windows build tags that other runners skip.
    #
    # After vet + tests, this job re-runs the release packaging path as a
    # smoke check: wails build -nsis, an artifact existence/freshness verify,
    # then pack.ps1 with its MSIX assertions. Packaging used to run only in
    # the tag-triggered desktop-release.yml, which is how the plated Store
    # icon (#250) survived every PR and shipped through a full certification
    # cycle; these steps make packaging breakage a PR-time failure instead.
    # The steps mirror desktop-release.yml by hand and the two must be kept in
    # sync; the app builds as version "dev", and nothing is uploaded or
    # published. The mirroring is no longer one-way: the vet step, the Wails
    # pin assertion and the NSIS retry below were copied INTO
    # desktop-release.yml, because the tag path is the one that cannot be
    # re-run cheaply and it had been the weaker of the two.
    runs-on: windows-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    env:
      # Wails CLI pin for the packaging smoke below. Must match desktop/go.mod
      # (asserted in the install step) and desktop-release.yml's install step;
      # bump all three together.
      WAILS_VERSION: v2.12.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Frontend install, test, build
        # Must precede any Go command in desktop/: main.go embeds
        # frontend/dist, which does not exist on a fresh checkout.
        working-directory: desktop/frontend
        # bash, not the Windows default pwsh: GitHub's pwsh wrapper appends
        # `exit $LASTEXITCODE`, so only the LAST command decides the step
        # result and a failing `npm ci` is not reliably fatal. bash runs with
        # -e, so the first failure stops the step and is the one reported.
        shell: bash
        run: |
          npm ci
          npm test
          npm run build

      - name: Vet
        run: go vet ./...
        working-directory: desktop

      - name: Test
        # -count=1 bypasses Go's test-result cache so stability re-runs always execute
        run: go test -count=1 ./...
        working-directory: desktop

      - name: Install Wails CLI
        shell: bash
        # Pinned to the version desktop/go.mod links against; the grep fails
        # the job if the two drift (the CLI embeds runtime assets that must
        # match the library, and this repo has eaten one version drift
        # already, #262). GOWORK=off so `go install` of an external tool is
        # never influenced by this repo's workspace.
        run: |
          grep -q "github.com/wailsapp/wails/v2 ${WAILS_VERSION}\$" desktop/go.mod \
            || { echo "WAILS_VERSION ${WAILS_VERSION} does not match desktop/go.mod" >&2; exit 1; }
          GOWORK=off go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"

      - name: Install NSIS
        shell: bash
        # windows-latest does not ship NSIS. One retry: this puts the
        # chocolatey CDN on the path of a required check on every code PR,
        # and a transient failure should cost seconds, not a manual re-run.
        run: |
          choco install nsis -y --no-progress \
            || { echo "choco install failed once; retrying" >&2; sleep 10; choco install nsis -y --no-progress; }
          # wails build -nsis silently skips the installer when makensis is
          # missing (it warns and returns success), so resolve it now or fail.
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          command -v makensis || { echo "makensis not resolvable after install" >&2; exit 1; }

      - name: Derive MSIX version
        id: ver
        shell: bash
        # Same derivation as desktop-release.yml's dispatch (dry-run) path, so
        # a wails.json shape change that would break the release pipeline's
        # grep goes red here, on the PR, first. The X.Y.Z feeds only pack.ps1's
        # Identity-version mapping; the in-app version is always "dev" on PRs.
        run: |
          version="$(grep -o '"productVersion": *"[^"]*"' desktop/wails.json | grep -o '[0-9.]\+')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "packing as $version"

      - name: Build app + installer (packaging smoke)
        working-directory: desktop
        shell: bash
        # Mirrors desktop-release.yml's build step. -s skips the frontend
        # build: the npm ci output from the frontend step above is what gets
        # embedded, not a second install driven by wails.json.
        run: |
          # cygpath: go env prints a Windows path whose drive-letter colon
          # would split a bash PATH entry.
          gopath_bin="$(cygpath -u "$(go env GOPATH)")/bin"
          export PATH="$PATH:/c/Program Files (x86)/NSIS:$gopath_bin"
          wails build -s -nsis -ldflags "-X main.version=dev"

      - name: Verify build artifacts
        shell: pwsh
        # wails build can exit 0 on silent failure; trust nothing it printed.
        # Existence + freshness only: desktop-release.yml additionally proves
        # the exe's ProductVersion resource, and that P/Invoke check stays
        # release-only rather than being duplicated here.
        run: |
          $exe = "desktop/build/bin/floe-desktop.exe"
          $installer = "desktop/build/bin/floe-desktop-amd64-installer.exe"
          foreach ($f in @($exe, $installer)) {
            if (-not (Test-Path $f)) { Write-Error "missing artifact: $f"; exit 1 }
            $age = (Get-Date) - (Get-Item $f).LastWriteTime
            if ($age.TotalMinutes -gt 30) { Write-Error "stale artifact: $f ($age old)"; exit 1 }
          }
          "verified: exe and installer both exist and are fresh"

      - name: Pack MSIX (Store packaging smoke)
        shell: pwsh
        # Runs the exact script the release pipeline uses, for its assertions:
        # pack.ps1 refuses to build a package whose resources.pri would not
        # index the unplated icon variants (the regression behind the plated
        # Store icon, #250). The .msix itself is discarded; an unsigned
        # package has no consumer on a PR, so nothing is uploaded.
        run: |
          desktop/build/msix/pack.ps1 -Version "${{ steps.ver.outputs.version }}" `
            -ExePath desktop/build/bin/floe-desktop.exe -OutDir dist-msix

  e2e:
    name: E2E (browser + CLI interop, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Requires both Go (CLI binary) and Node (server + client + Playwright)
    needs: [cli, build-and-lint, server]
    strategy:
      # One OS failing must not hide results from the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Version comes from packageManager in client/package.json
          package_json_file: client/package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        # $(...) and $GITHUB_OUTPUT appends are bash-isms; the Windows default
        # shell is pwsh, so pin bash for a portable step.
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Get Playwright browser cache directory
        id: playwright-cache
        shell: bash
        # Default per-OS browser paths: https://playwright.dev/docs/browsers
        run: |
          case "$RUNNER_OS" in
            Linux)   echo "PLAYWRIGHT_CACHE=$HOME/.cache/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            macOS)   echo "PLAYWRIGHT_CACHE=$HOME/Library/Caches/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "PLAYWRIGHT_CACHE=$LOCALAPPDATA/ms-playwright" >> "$GITHUB_OUTPUT" ;;
            *)       echo "Unknown RUNNER_OS: $RUNNER_OS" >&2; exit 1 ;;
          esac

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright-cache.outputs.PLAYWRIGHT_CACHE }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright Chromium
        # Always run: on a browser-cache hit the download is skipped anyway,
        # but the Linux system dependencies (--with-deps) still need installing.
        run: pnpm exec playwright install --with-deps chromium
        working-directory: client

      - name: Build client (production)
        # NEXT_PUBLIC_* is inlined into the bundle at BUILD time by Next.js,
        # so the socket URL must be set here, not on the test step (next start
        # never reads it). Each leg builds its own client: build-and-lint
        # bakes the production https://api.floe.one URL, and a .next built on
        # one OS is not reused on another.
        run: pnpm build
        working-directory: client
        env:
          # 127.0.0.1, not localhost: see the webServer env note in
          # client/playwright.config.ts.
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:3001

      - name: Run E2E tests (browser + CLI interop)
        run: pnpm exec playwright test
        working-directory: client

      - name: Upload Playwright evidence
        # Not failure()-gated: a test that fails once and passes on the CI
        # retry leaves a green job, and its first-attempt trace plus the CLI
        # transcripts attached by e2e/helpers.ts live in these directories.
        # Uploading them on every non-cancelled run is what makes flaky
        # attempts investigable at all.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence-${{ matrix.os }}
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7
          # Artifact names are immutable within a run since upload-artifact
          # v4, so without this a full re-run fails at upload. A re-run
          # replaces the previous attempt's artifact: harvest evidence
          # before re-running.
          overwrite: true

  back-compat:
    name: Back-compat (HEAD vs latest release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same toolchain needs as e2e; ubuntu-only because the wire protocol under
    # test is OS-independent and one leg keeps the release download cheap.
    needs: [cli, build-and-lint, server]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Version comes from packageManager in client/package.json
          package_json_file: client/package.json

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Linux-only job, so no per-OS path dance like the e2e matrix; same
          # cache key as the ubuntu e2e leg so this job rides its cache.
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('client/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install Playwright Chromium
        # Always run: on a browser-cache hit the download is skipped anyway,
        # but the Linux system dependencies (--with-deps) still need installing.
        run: pnpm exec playwright install --with-deps chromium
        working-directory: client

      - name: Build client (production)
        # NEXT_PUBLIC_* is inlined into the bundle at BUILD time by Next.js,
        # so the socket URL must be set here, not on the test step (next start
        # never reads it). Each leg builds its own client: build-and-lint
        # bakes the production https://api.floe.one URL, and a .next built on
        # one OS is not reused on another.
        run: pnpm build
        working-directory: client
        env:
          # 127.0.0.1, not localhost: see the webServer env note in
          # client/playwright.config.ts.
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:3001

      - name: Download latest released CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve the tag FIRST, then download BY TAG: if a release published
          # mid-job, "latest" could otherwise change between the two gh calls.
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "Released tag: $tag"
          dest="$RUNNER_TEMP/floe-released"
          mkdir -p "$dest"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dest" \
            --pattern 'floe_*_linux_amd64.tar.gz' --pattern 'checksums.txt'
          cd "$dest" || exit 1
          # checksums.txt covers every asset; verify just the one we fetched.
          sha256sum --check <(grep linux_amd64.tar.gz checksums.txt)
          tar -xzf floe_*_linux_amd64.tar.gz floe
          chmod +x floe
          echo "FLOE_RELEASED_CLI=$dest/floe" >> "$GITHUB_ENV"
          echo "FLOE_RELEASED_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Run back-compat E2E tests
        working-directory: client
        run: |
          # Fail loud if the export above ever regresses; otherwise the spec
          # would skip itself and this job would go green testing nothing.
          test -x "$FLOE_RELEASED_CLI"
          pnpm exec playwright test e2e/back-compat.spec.ts

      - name: Upload Playwright evidence
        # Same reasoning as the e2e leg: keep first-attempt traces and CLI
        # transcripts from retry-passed (green) runs.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: back-compat-evidence
          path: |
            client/playwright-report/
            client/test-results/
          if-no-files-found: ignore
          retention-days: 7
          # Same re-run rationale as the e2e leg.
          overwrite: true

  docker-smoke:
    # Self-hosting smoke test: proves the source still produces a working stack
    # from a clean checkout. The client image was silently unbuildable for 16
    # days once (fixed in 88a429b) because nothing in CI ever built it; this job
    # is that missing guard.
    #
    # It runs through docker-compose.build.yml. docker-compose.yml alone now
    # PULLS the published images, so without the overlay this job would only
    # prove that ghcr.io serves what it served yesterday, not that this commit
    # still builds. The published images have their own gate in images.yml.
    #
    # Started OUTSIDE the ci-green gate per the soak policy in CLAUDE.md and
    # was promoted into the gate's needs list in #257 after proving stable.
    name: Docker (self-hosting stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose files
        run: |
          # Both the pull-only file a self-hoster downloads and the contributor
          # overlay have to stay valid.
          docker compose config -q
          docker compose --profile turn config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q

      - name: Build images
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml build

      - name: Smoke the built images
        # The same assertions images.yml gates publishing on, run here so a
        # Dockerfile change is judged at PR time rather than after merge.
        #
        # Starting the stack and curling / is not enough on its own. A broken
        # image optimiser does not fail: Next quietly serves the original PNG, so
        # / still returns 200 while every visitor silently loses optimisation.
        # Measured: a working optimiser answers image/webp, the fallback answers
        # image/png, and the content type is the only thing that separates them.
        #
        # Runs BEFORE the stack starts, not after: the script publishes 3000 and
        # 3001 itself, the same ports the compose stack uses. It removes its own
        # containers on exit.
        run: |
          bash .github/scripts/smoke-image.sh floe-server floe-server:dev
          bash .github/scripts/smoke-image.sh floe-client floe-client:dev

      - name: Start the stack
        # No .env file, exactly what a first-time self-hoster gets. The stack
        # must come up with zero configuration.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
            up -d --wait --wait-timeout 180

      - name: Assert the server answers
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --retry-connrefused http://localhost:3001/health

      - name: Assert the client serves the app
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --retry-connrefused -o /dev/null http://localhost:3000/

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
            logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v

  ci-green:
    # The one required status check on main (see the main-protection
    # ruleset). DO NOT rename this job or its name without updating the
    # ruleset first: the ruleset matches the check by the name string
    # "CI green", and after a rename every PR would block on a check that
    # never reports again.
    name: CI green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Every job in this workflow must be listed here, or its failure is
    # invisible to branch protection. Nothing is soaking outside the gate
    # right now; see CLAUDE.md for the promotion policy a new job follows.
    #
    # if: always() is load-bearing and must never become !cancelled():
    # without always() a failed or cancelled dependency would skip this job,
    # and GitHub counts a skipped required check as passing.
    needs: [changes, actionlint, build-and-lint, server, cli, desktop, e2e, back-compat, docker-smoke]
    if: always()
    steps:
      - name: Report dependency results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: echo "$NEEDS_JSON"

      - name: Fail if any dependency failed or was cancelled
        # Skipped is a pass on purpose: docs-only PRs skip the heavy jobs.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required job failed or was cancelled; see the results above."
          exit 1
