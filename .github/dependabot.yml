# Dependabot version updates. Monthly and grouped on purpose: this repo is
# solo-maintained, so one grouped PR per ecosystem per month bounds the
# review load. Security updates are unaffected by this schedule: they open
# as soon as an advisory lands and have their own separate internal PR
# limit, so the monthly cadence only throttles routine version bumps.
version: 2
updates:
  # client/ (pnpm, packageManager pnpm@11.1.2), server/ (plain npm) and
  # desktop/frontend/ (plain npm) share one npm entry via the multi-directory
  # form. A group spans those directories rather than splitting by them: #182
  # and #256 both landed as a single "across 2 directories" PR, as did the
  # docker group in #227. That is the intent, one PR per ecosystem per month,
  # but it does mean one bad bump in any directory holds up the rest, which is
  # the same reason majors are excluded from the group below.
  - package-ecosystem: "npm"
    directories:
      - "/client"
      - "/server"
      - "/desktop/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # @vitejs/plugin-react 6 peers on vite "^8.0.0" exclusively (the other three
    # peers it declares are optional). vite 8 is itself under a live
    # `@dependabot ignore this major version`, set when #359 was closed because
    # @vitejs/plugin-react 4.7.0 caps vite at ^7.0.0. So a plugin-react major can
    # never resolve here until vite 8 is taken by hand, and Dependabot re-opens an
    # unmergeable PR on every new 6.x release: #371 was that PR, and seven 6.x
    # releases shipped in the five months after 6.0.0. Scoped with update-types so
    # 4.x minors and patches still arrive and so a plugin-react advisory can still
    # open its own security PR ("update-types only affects version updates, not
    # security updates"). A bare dependency-name would have silenced that too.
    # One update-type, following the node ignore below rather than the wails one:
    # only the major is unwanted. Lift this together with the vite 8 ignore when
    # vite 8 and plugin-react 6 are taken as one hand-built pair.
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
    groups:
      # Minor and patch only: a single incompatible major inside a 20-update
      # group PR blocks every other update in it (day one: the TypeScript
      # 5 -> 7 bump broke typescript-eslint and poisoned 22 good bumps).
      # Majors fall out of the group and arrive as individual PRs instead,
      # each judged on its own by the gated CI.
      npm-deps:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The two Go modules the root go.work joins. desktop/ had no entry until
  # now, so it moved only when a security advisory landed and drifted from
  # cli/ in between: #345 arrived as a four-module jump because nothing
  # routine had touched desktop/go.mod. That drift is not contained to the
  # desktop app, because goreleaser builds the CLI with the workspace active,
  # so a version only desktop/ requires still reaches the released binary.
  # The two arrive in one "across 2 directories" PR, which is what we want:
  # the root go.work puts both modules in one MVS graph, so moving them in
  # the same PR is what keeps them from diverging again.
  - package-ecosystem: "gomod"
    directories:
      - "/cli"
      - "/desktop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Wails is never Dependabot's call for a routine bump. ci.yml pins
    # WAILS_VERSION and greps desktop/go.mod for that exact string, because
    # the Wails CLI embeds runtime assets that must match the library and this
    # repo has eaten one version drift already (#262). Any routine bump, major,
    # minor or patch, fails the desktop job on arrival unless ci.yml and
    # desktop-release.yml move in the same commit, so Wails moves by hand.
    # The three update-types are spelled out rather than left as a bare
    # dependency-name on purpose. An ignore applies to version updates AND
    # security updates, but update-types scopes it to version updates only
    # ("update-types only affects version updates, not security updates"), so
    # a Wails advisory can still open its own PR. A bare dependency-name would
    # have silenced that too. Same shape as the node ignore below.
    ignore:
      - dependency-name: "github.com/wailsapp/wails/v2"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      go-deps:
        patterns:
          - "*"

  # The two Dockerfile base images. Unmanaged until now because the images were
  # only ever built locally by self-hosters; once they are published to ghcr.io
  # they are an artifact this repo ships, so a stale base image becomes our CVE
  # surface rather than the builder's.
  - package-ecosystem: "docker"
    directories:
      - "/client"
      - "/server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # A Node major is never Dependabot's call. Only even-numbered Node releases
    # become LTS; odd ones are roughly eight-month previews that reach end of
    # life with no security patches and never get one. Dependabot cannot see
    # that distinction, so in #227 it moved both images 24 -> 25 and the
    # published images spent two months on a runtime that died on 2026-06-01.
    # Minor and patch bumps of the same major are still wanted, and security
    # advisories ignore this block entirely. Majors move by hand, when the next
    # even release reaches Active LTS (26 does so on 2026-10-28).
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-deps:
        patterns:
          - "*"

  # Weekly rather than monthly: this entry is what keeps the commit-SHA pins
  # in .github/workflows/ fresh (Dependabot bumps the pinned SHA and
  # maintains the trailing # vX.Y.Z comment), and grouped actions PRs are
  # tiny to review.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-deps:
        patterns:
          - "*"
