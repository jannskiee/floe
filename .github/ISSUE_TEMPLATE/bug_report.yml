name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the information below.

        Found a security vulnerability? Do not open a public issue. Report it privately, as [SECURITY.md](https://github.com/jannskiee/floe/blob/main/SECURITY.md) describes.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
      placeholder: When I tried to..., the app showed...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Where were you using Floe?
      description: "Pick the one the problem showed on. If the other side of the transfer used a different one, name it under Additional context."
      options:
        - Web app (floe.one)
        - Request link page (floe.one/r/...)
        - Floe Desktop (Microsoft Store)
        - Floe Desktop (installer or portable zip)
        - CLI (floe)
        - Self-hosted server
        - Not sure
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      description: "Floe Desktop: Settings > About shows App version, and Copy there puts it on the clipboard with the server in use. CLI: `floe --version`. Self-hosted: the image tag you run. Skip for floe.one."
      placeholder: desktop-v0.3.2 or floe 1.11.2
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: "The system the problem showed on. For the CLI, add the architecture (amd64 or arm64) under Additional context if you know it."
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS or iPadOS
        - Other
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Computer
        - Phone
        - Tablet
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      description: For the web app and the request link page. Skip for the CLI and Floe Desktop.
      placeholder: Chrome, Edge, Firefox, or Safari, with its version
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other information that might help.
    validations:
      required: false
